name: results

# Re-run every experiment when the algorithm changes and open a pull request
# with the new images and numbers, so GitHub's image diff shows what changed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mesh/**"
      - "render/**"
      - "run_experiments.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # Results must not depend on the CPU (DEVLOG.md); log which one this is.
      - name: Show the CPU
        run: |
          grep -m1 "model name" /proc/cpuinfo
          grep -q -m1 avx512f /proc/cpuinfo && echo "AVX-512: yes" || echo "AVX-512: no"

      - name: Keep the old summary for comparison
        run: cp results/summary.json "$RUNNER_TEMP/old_summary.json"

      - name: Run the experiments
        run: python run_experiments.py

      - name: Write the pull request body
        id: diff
        run: python scripts/summary_diff.py "$RUNNER_TEMP/old_summary.json" results/summary.json > "$RUNNER_TEMP/pr_body.md"

      # Only open a pull request if an image or a number changed; timings
      # alone differ on every machine and are not worth a review.
      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # main uses auto/update-results; a run started on another branch gets
          # its own PR branch so the two never overwrite each other.
          branch: ${{ github.ref_name == 'main' && 'auto/update-results' || format('auto/update-results-{0}', github.ref_name) }}
          title: Update results after code change
          commit-message: Update results after code change
          body-path: ${{ runner.temp }}/pr_body.md
          add-paths: |
            results/**
            docs/**
